<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Debug - Excel File Structure</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f1f1f1; padding: 10px; overflow-x: auto; font-size: 12px; max-height: 300px; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
    </style>
</head>
<body>
    <h1>🔍 Library Debug - Excel File Structure Analysis</h1>
      <div class="debug-section">
        <h2>🧪 Generate & Analyze Structure</h2>
        <label>
            <input type="checkbox" id="debugTracker"> Include Tracker Sheet (Optional)
        </label><br><br>
        <button onclick="analyzeExcelStructure()">Generate & Debug Excel Structure</button>
        <div id="analysis-results"></div>
    </div>

    <div class="debug-section">
        <h2>📁 Generated Files Preview</h2>
        <div id="files-preview"></div>
    </div>

    <div class="debug-section">
        <h2>⚠️ Validation Issues</h2>
        <div id="validation-issues"></div>
    </div>

    <script type="module">        window.analyzeExcelStructure = async function() {
            const results = document.getElementById('analysis-results');
            const preview = document.getElementById('files-preview');
            const issues = document.getElementById('validation-issues');
            const includeTracker = document.getElementById('debugTracker').checked;
            
            results.innerHTML = `⏳ Analyzing Excel structure${includeTracker ? ' with tracker' : ' (calendar only)'}...`;
              try {
                // Import all available functions to see what's actually exported
                const libraryImports = await import('./index.js');
                console.log('📦 Available library exports:', Object.keys(libraryImports));
                
                // Test the new convenience function first
                const { generateCompleteExcel, createZip } = libraryImports;
                
                if (!generateCompleteExcel) {
                    throw new Error('generateCompleteExcel function not found in library exports');
                }
                
                const options = {
                    year: 2024,
                    month: 0,
                    eventRows: 2,
                    includeTracker: includeTracker, // Use checkbox value
                    legendValues: ['Test1', 'Test2'],
                    customColors: ['FFFF0000', 'FF00FF00']
                };
                
                console.log('🔍 Generating Excel components with options:', options);
                  // Generate using the convenience function
                let files;
                
                try {
                    files = generateCompleteExcel(options);
                } catch (convenienceError) {
                    console.log('⚠️ Convenience function failed, trying manual generation:', convenienceError.message);
                    
                    // Fallback: Manual generation using individual components
                    const { 
                        buildCalendarSheetWithExcelBuilder,
                        getStylesXML,
                        getContentTypesXML,
                        getWorkbookXML,
                        getRelsXML,
                        getWorkbookRelsXML,
                        getTrackerSheetXML
                    } = libraryImports;
                    
                    if (!buildCalendarSheetWithExcelBuilder) {
                        throw new Error('buildCalendarSheetWithExcelBuilder not found in library exports');
                    }
                    
                    // Generate individual components
                    const calendarXML = buildCalendarSheetWithExcelBuilder(
                        options.year, options.month, options.eventRows, false, 
                        options.legendValues, options.customColors
                    );
                    const stylesXML = getStylesXML(options.eventRows, options.customColors);
                    const contentTypesXML = getContentTypesXML(includeTracker);
                    const workbookXML = getWorkbookXML(includeTracker);
                    const relsXML = getRelsXML();
                    const workbookRelsXML = getWorkbookRelsXML(includeTracker);
                    
                    // Base files
                    files = [
                        { name: '[Content_Types].xml', content: contentTypesXML },
                        { name: '_rels/.rels', content: relsXML },
                        { name: 'xl/workbook.xml', content: workbookXML },
                        { name: 'xl/worksheets/sheet1.xml', content: calendarXML },
                        { name: 'xl/styles.xml', content: stylesXML },
                        { name: 'xl/_rels/workbook.xml.rels', content: workbookRelsXML }
                    ];
                    
                    // Add tracker if requested
                    if (includeTracker && getTrackerSheetXML) {
                        const trackerXML = getTrackerSheetXML(options.legendValues);
                        files.push({ name: 'xl/worksheets/sheet2.xml', content: trackerXML });
                    }
                }
                
                if (!files || !Array.isArray(files)) {
                    throw new Error('Failed to generate files using both convenience function and manual method');
                }
                
                console.log('📁 Generated files:', files.map(f => f.name));
                
                // Analyze each component
                const analysis = {};
                files.forEach(file => {
                    const baseName = file.name.replace(/^.*[\\\/]/, ''); // Get filename only
                    analysis[baseName] = analyzeXML(file.content, getExpectedRoot(file.name));
                });
                
                // Check for common Excel corruption issues
                const validationProblems = validateExcelStructure(files, includeTracker);
                
                // Display results
                const expectedSheets = includeTracker ? 2 : 1;
                results.innerHTML = `
                    <div class="success">
                        ✅ Structure Analysis Complete<br>
                        📊 Files generated: ${files.length}<br>
                        📑 Expected sheets: ${expectedSheets} (Calendar${includeTracker ? ' + Tracker' : ''})<br>
                        📝 Total size: ${files.reduce((sum, f) => sum + f.content.length, 0)} bytes
                    </div>
                `;
                
                // Show file analysis
                let analysisHTML = '<h3>📋 XML Analysis Results:</h3>';
                for (const [name, result] of Object.entries(analysis)) {
                    analysisHTML += `
                        <div class="${result.valid ? 'success' : 'error'}">
                            <strong>${result.valid ? '✅' : '❌'} ${name}</strong><br>
                            Size: ${result.size} bytes | Root: ${result.rootElement}<br>
                            ${result.issues.length > 0 ? 'Issues: ' + result.issues.join(', ') : 'No issues found'}
                        </div>
                    `;
                }
                preview.innerHTML = analysisHTML;
                
                // Show validation problems
                if (validationProblems.length > 0) {
                    issues.innerHTML = `
                        <div class="error">
                            <h3>⚠️ Validation Issues Found:</h3>
                            ${validationProblems.map(issue => `<div>❌ ${issue}</div>`).join('')}
                        </div>
                    `;
                } else {
                    issues.innerHTML = '<div class="success">✅ No validation issues found</div>';
                }
                
                // Show detailed XML content for debugging
                let detailHTML = '<h3>📄 Generated XML Content:</h3>';
                files.forEach(file => {
                    detailHTML += `
                        <h4>📁 ${file.name}</h4>
                        <pre>${escapeHTML(file.content.substring(0, 500))}${file.content.length > 500 ? '...' : ''}</pre>
                    `;
                });
                preview.innerHTML += detailHTML;
                
                // Try to create ZIP and analyze
                try {
                    const zipBytes = createZip(files);
                    results.innerHTML += `<br>📦 ZIP creation: ✅ Success (${zipBytes.length} bytes)`;
                    
                    // Offer download for manual testing
                    const blob = new Blob([zipBytes], { 
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
                    });
                    const url = URL.createObjectURL(blob);
                    const filename = `debug-excel${includeTracker ? '-with-tracker' : ''}.xlsx`;
                    results.innerHTML += `<br><button onclick="downloadDebugFile('${url}', '${filename}')">📥 Download for Manual Testing</button>`;
                    window.debugFileUrl = url;
                    
                } catch (zipError) {
                    results.innerHTML += `<br>📦 ZIP creation: ❌ Error - ${zipError.message}`;
                }
                
            } catch (error) {
                results.innerHTML = `<div class="error">❌ Analysis failed: ${error.message}</div>`;
                console.error('Analysis error:', error);
            }
        };
        
        function analyzeXML(xmlContent, expectedRoot) {
            const issues = [];
            
            // Check if it's valid XML-like
            if (!xmlContent.includes('<?xml')) {
                issues.push('Missing XML declaration');
            }
            
            if (!xmlContent.includes('<' + expectedRoot)) {
                issues.push(`Missing expected root element: ${expectedRoot}`);
            }
            
            // Check for common XML issues
            if (xmlContent.includes('&') && !xmlContent.includes('&amp;') && !xmlContent.includes('&lt;')) {
                issues.push('Unescaped & characters');
            }
            
            // Extract root element
            const rootMatch = xmlContent.match(/<(\w+)/);
            const rootElement = rootMatch ? rootMatch[1] : 'Unknown';
            
            return {
                valid: issues.length === 0,
                size: xmlContent.length,
                rootElement,
                issues
            };
        }
          function validateExcelStructure(files, includeTracker = false) {
            const problems = [];
            
            // Check required files
            const requiredFiles = [
                '[Content_Types].xml',
                '_rels/.rels', 
                'xl/workbook.xml',
                'xl/worksheets/sheet1.xml',
                'xl/styles.xml',
                'xl/_rels/workbook.xml.rels'
            ];
            
            // Add tracker sheet to required files if it should be included
            if (includeTracker) {
                requiredFiles.push('xl/worksheets/sheet2.xml');
            }
            
            requiredFiles.forEach(required => {
                if (!files.find(f => f.name === required)) {
                    problems.push(`Missing required file: ${required}`);
                }
            });
            
            // Check if tracker exists when it shouldn't
            if (!includeTracker) {
                const trackerFile = files.find(f => f.name === 'xl/worksheets/sheet2.xml');
                if (trackerFile) {
                    problems.push('Tracker sheet found but not requested (includeTracker=false)');
                }
            }
            
            // Check content types includes all referenced files
            const contentTypes = files.find(f => f.name === '[Content_Types].xml');
            if (contentTypes) {
                if (!contentTypes.content.includes('worksheet')) {
                    problems.push('Content types missing worksheet reference');
                }
                if (!contentTypes.content.includes('workbook')) {
                    problems.push('Content types missing workbook reference');
                }
                if (!contentTypes.content.includes('styles')) {
                    problems.push('Content types missing styles reference');
                }
                
                // Check tracker content type
                if (includeTracker && !contentTypes.content.includes('sheet2.xml')) {
                    problems.push('Content types missing tracker sheet reference');
                }
                if (!includeTracker && contentTypes.content.includes('sheet2.xml')) {
                    problems.push('Content types includes tracker but tracker not requested');
                }
            }
            
            // Check workbook references correct sheets
            const workbook = files.find(f => f.name === 'xl/workbook.xml');
            if (workbook) {
                const expectedSheets = includeTracker ? 2 : 1;
                const sheetMatches = workbook.content.match(/<sheet /g);
                const actualSheets = sheetMatches ? sheetMatches.length : 0;
                
                if (actualSheets !== expectedSheets) {
                    problems.push(`Workbook has ${actualSheets} sheets, expected ${expectedSheets}`);
                }
                
                if (includeTracker && !workbook.content.includes('Tracker')) {
                    problems.push('Workbook missing Tracker sheet reference');
                }
            }
            
            return problems;
        }
        
        function getExpectedRoot(filename) {
            if (filename.includes('worksheet')) return 'worksheet';
            if (filename.includes('workbook.xml')) return 'workbook';
            if (filename.includes('styles')) return 'styleSheet';
            if (filename.includes('Content_Types')) return 'Types';
            if (filename.includes('.rels')) return 'Relationships';
            return 'unknown';
        }
        
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                };
                return charsToReplace[tag] || tag;
            });
        }
          window.downloadDebugFile = function(url, filename = 'debug-excel-file.xlsx') {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
</html>
